services:
  stockflow-database:
    image: postgres:16-alpine
    container_name: ${DATABASE_HOST}
    networks:
      - stockflow-net
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASS}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - stockflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s

  stockflow-migrator:
    image: stockflow-migrator
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile.migrator
    container_name: stockflow-migrator
    networks:
      - stockflow-net
    restart: "no"
    env_file:
      - .env
    depends_on:
      stockflow-database:
        condition: service_healthy
    entrypoint: ["./bin/migrator"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "${DATABASE_HOST}"]
      interval: 10s
      retries: 3

networks:
  stockflow-net:
    name: stockflow-net
    driver: bridge

volumes:
  stockflow_db_data:
